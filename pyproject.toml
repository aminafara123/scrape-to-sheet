[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrape-to-sheet"
version = "0.1.0"
description = "A reusable, config-driven web scraper: one YAML config turns web pages into clean, structured CSV (and optionally a Google Sheet)."
authors = [{name = "Al Amin Bashir Afara", email = "aminafara123@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
sheets = ["gspread>=6,<7", "google-auth>=2,<3"]

[project.scripts]
scrape-to-sheet = "scrape_to_sheet.core:main"

[tool.hatch.build.targets.wheel]
packages = ["scrape_to_sheet"]
